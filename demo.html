<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure Demo — GameWorkShop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100vw;
        }

        #gameCanvas {
            background-color: #87CEEB;
            border: 4px solid #228B22;
            box-shadow: 0 0 20px rgba(34, 139, 34, 0.3);
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        #hint {
            color: #fff;
            background: rgba(0,0,0,.4);
            padding: 6px 10px;
            margin-top: 8px;
            font-size: 13px;
            border-radius: 6px;
        }

    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hint">Arrows / WASD to move, Space to jump, R to restart &middot; <a href="gallery.html" style="color:#ffcc66;">asset gallery</a></div>
    </div>

    <script>
        // ============================================
        // ERROR OVERLAY
        // ============================================
        // Surfaces uncaught JS errors and missing assets visibly so you don't need DevTools.
        const _errorOverlay = (() => {
            const el = document.createElement('div');
            el.style.cssText =
                'position:fixed;top:0;left:0;right:0;background:rgba(180,30,30,0.92);' +
                'color:#fff;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;' +
                'padding:8px 12px;white-space:pre-wrap;z-index:9999;display:none;' +
                'max-height:40vh;overflow:auto;';
            document.body.appendChild(el);
            let hasError = false;
            return {
                error(msg) {
                    hasError = true;
                    el.style.background = 'rgba(180,30,30,0.92)';
                    el.style.display = 'block';
                    el.textContent += msg + '\n';
                },
                warn(msg) {
                    el.style.display = 'block';
                    if (!hasError) el.style.background = 'rgba(190,150,30,0.92)';
                    el.textContent += msg + '\n';
                }
            };
        })();
        window.addEventListener('error', e => _errorOverlay.error(
            `Error: ${e.message}\n  at ${e.filename || '?'}:${e.lineno || '?'}:${e.colno || '?'}`
        ));
        window.addEventListener('unhandledrejection', e => _errorOverlay.error(
            `Unhandled promise rejection: ${e.reason}`
        ));

        // ============================================
        // INPUT HANDLING
        // ============================================
        const keys = { left: false, right: false, up: false };
        let restartRequested = false;

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'ArrowLeft':  case 'KeyA': keys.left  = true; break;
                case 'ArrowRight': case 'KeyD': keys.right = true; break;
                case 'ArrowUp':    case 'KeyW': case 'Space':
                    keys.up = true; e.preventDefault(); break;
                case 'KeyR': restartRequested = true; break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'ArrowLeft':  case 'KeyA': keys.left  = false; break;
                case 'ArrowRight': case 'KeyD': keys.right = false; break;
                case 'ArrowUp':    case 'KeyW': case 'Space': keys.up = false; break;
            }
        });

        // ============================================
        // ASSET LOADING
        // ============================================
        let MANIFEST = null;
        const IMG = {};
        const SND = {};
        const MISSING_ASSETS = [];

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload  = () => resolve(img);
                img.onerror = () => {
                    MISSING_ASSETS.push(src);
                    console.warn('image failed:', src);
                    resolve(null);
                };
                img.src = src;
            });
        }

        async function loadAllImages(manifest) {
            const jobs = [];
            jobs.push(loadImage(manifest.player.spritesheet).then(i => IMG['player_sheet'] = i));
            for (const [k, p] of Object.entries(manifest.player.poses))
                jobs.push(loadImage(p).then(i => IMG['player_' + k] = i));
            for (const group of ['tiles', 'items', 'hud', 'bg']) {
                for (const [k, p] of Object.entries(manifest[group]))
                    jobs.push(loadImage(p).then(i => IMG[group + '_' + k] = i));
            }
            for (const [name, frames] of Object.entries(manifest.enemies)) {
                (frames.walk || []).forEach((p, i) =>
                    jobs.push(loadImage(p).then(img => IMG[`enemy_${name}_walk${i+1}`] = img)));
                if (frames.dead)
                    jobs.push(loadImage(frames.dead).then(img => IMG[`enemy_${name}_dead`] = img));
            }
            await Promise.all(jobs);
        }

        function loadSound(src, loop = false) {
            const a = new Audio();
            a.preload = 'auto';   // start fetching now — avoids silent first-click
            a.loop = loop;
            a.src = src;
            return a;
        }

        function loadAllSounds(manifest) {
            for (const [k, p] of Object.entries(manifest.sfx))   SND['sfx_'   + k] = loadSound(p);
            for (const [k, p] of Object.entries(manifest.music)) SND['music_' + k] = loadSound(p, true);
        }

        function play(key) {
            const s = SND[key];
            if (!s) return;
            s.currentTime = 0;
            s.play().catch(() => {});
        }

        // ============================================
        // AUDIO UNLOCK + MUSIC CONTROL
        // ============================================
        // Browsers block audio until first user gesture. We draw an in-canvas
        // prompt (see drawAudioGate) while audioUnlocked is false; first click
        // or keypress starts whatever track is queued.
        let audioUnlocked = false;
        let currentMusicKey = null;

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            if (currentMusicKey) playMusic(currentMusicKey);
        }
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('keydown',     unlockAudio);

        function playMusic(key) {
            if (currentMusicKey && currentMusicKey !== key) {
                const old = SND['music_' + currentMusicKey];
                if (old) { old.pause(); old.currentTime = 0; }
            }
            currentMusicKey = key;
            if (!audioUnlocked) return;
            const m = SND['music_' + key];
            if (!m) return;
            m.volume = 0.4;
            m.play().catch(() => {});
        }

        function stopAllMusic() {
            for (const k of Object.keys(SND)) {
                if (k.startsWith('music_')) { SND[k].pause(); SND[k].currentTime = 0; }
            }
            currentMusicKey = null;
        }

        function crossfadeTo(key, frames = 30) {
            if (currentMusicKey === key) return;
            const oldM = currentMusicKey ? SND['music_' + currentMusicKey] : null;
            const newM = SND['music_' + key];
            if (!newM) { playMusic(key); return; }
            currentMusicKey = key;
            if (audioUnlocked) {
                newM.volume = 0;
                newM.currentTime = 0;
                newM.play().catch(() => {});
            }
            let t = 0;
            const id = setInterval(() => {
                t++;
                const p = t / frames;
                if (oldM) oldM.volume = Math.max(0, 0.4 * (1 - p));
                newM.volume = Math.min(0.4, 0.4 * p);
                if (t >= frames) {
                    if (oldM) { oldM.pause(); oldM.currentTime = 0; }
                    clearInterval(id);
                }
            }, 16);
        }

        // ============================================
        // SPRITE HELPERS
        // ============================================
        function drawSheetFrame(ctx, img, frame, dx, dy, dw, dh) {
            ctx.drawImage(img, frame.x, frame.y, frame.w, frame.h, dx, dy, dw, dh);
        }
        function drawTile(ctx, img, x, y, w, h) {
            if (!img) return;
            ctx.drawImage(img, x, y, w, h);
        }

        // ============================================
        // LEVEL DATA
        // ============================================
        // Single source of truth for the whole level. Tweak coordinates here;
        // buildLevel() turns this into class instances on each restart.
        const WORLD_WIDTH  = 4000;
        const WORLD_HEIGHT = 600;
        const VIEW_WIDTH   = 800;

        const LEVEL_DATA = {
            playerSpawn: { x: 80, y: 500 },
            flag:        { x: 3920, y: 510 },
            platforms: [
                // Screen 1 — tutorial
                { x: 0,    y: 550, w: 800 },
                { x: 200,  y: 470, w: 100 },
                { x: 400,  y: 380, w: 100 },
                // Screen 2 — slime intro (gap 1100..1300)
                { x: 800,  y: 550, w: 300 },
                { x: 1100, y: 450, w: 200 },
                { x: 1300, y: 550, w: 300 },
                { x: 1450, y: 380, w: 100 },
                // Screen 3 — vertical climb
                { x: 1600, y: 550, w: 800 },
                { x: 1700, y: 470, w: 120 },
                { x: 1900, y: 390, w: 120 },
                { x: 2100, y: 310, w: 120 },
                { x: 1850, y: 230, w: 120 },
                // Screen 4 — danger zone (big gap with floating platforms)
                { x: 2400, y: 550, w: 100 },
                { x: 2550, y: 450, w: 100 },
                { x: 2700, y: 380, w: 100 },
                { x: 2850, y: 320, w: 100 },
                { x: 3000, y: 380, w: 100 },
                { x: 3100, y: 550, w: 100 },
                // Screen 5 — boss approach (dungeon music)
                { x: 3200, y: 550, w: 800 },
                { x: 3400, y: 470, w: 80 },
                { x: 3700, y: 470, w: 80 },
            ],
            enemies: [
                { type: 'slime', x: 1350, y: 510, patrol: 200 },
                { type: 'slime', x: 1700, y: 510, patrol: 150 },
                { type: 'fly',   x: 2050, y: 280, patrol: 100 },
                { type: 'fly',   x: 2620, y: 350, patrol: 120 },
                { type: 'fly',   x: 2900, y: 280, patrol: 120 },
                { type: 'slime', x: 3500, y: 510, patrol: 150 },
                { type: 'slime', x: 3800, y: 510, patrol:  80 },
            ],
            pickups: [
                { kind: 'coin', x: 240,  y: 430 },
                { kind: 'coin', x: 440,  y: 340 },
                { kind: 'coin', x: 640,  y: 510 },
                { kind: 'coin', x: 900,  y: 510 },
                { kind: 'coin', x: 1130, y: 410 },
                { kind: 'coin', x: 1380, y: 510 },
                { kind: 'coin', x: 1480, y: 340 },
                { kind: 'gem',  x: 1200, y: 410 },
                { kind: 'coin', x: 1740, y: 430 },
                { kind: 'coin', x: 1940, y: 350 },
                { kind: 'coin', x: 2140, y: 270 },
                { kind: 'gem',  x: 1880, y: 190 },
                { kind: 'gem',  x: 2300, y: 510 },
                { kind: 'coin', x: 2570, y: 410 },
                { kind: 'coin', x: 2730, y: 340 },
                { kind: 'gem',  x: 2880, y: 280 },
                { kind: 'star', x: 3030, y: 340 },
            ],
        };

        // ============================================
        // PLATFORM CLASS
        // ============================================
        class Platform {
            constructor(x, y, width) {
                this.x = x; this.y = y;
                this.width = width;
                this.height = 40;
            }
            draw(ctx) {
                const tw = 40;
                const count = Math.ceil(this.width / tw);
                for (let i = 0; i < count; i++) {
                    const img = count === 1 ? IMG.tiles_grass_mid
                              : i === 0 ? IMG.tiles_grass_left
                              : i === count - 1 ? IMG.tiles_grass_right
                              : IMG.tiles_grass_mid;
                    drawTile(ctx, img, this.x + i * tw, this.y, tw, tw);
                }
            }
            checkCollision(p) {
                return p.x < this.x + this.width && p.x + p.width > this.x
                    && p.y < this.y + this.height && p.y + p.height > this.y;
            }
        }

        // ============================================
        // PICKUP CLASS (coins / gems / stars)
        // ============================================
        const PICKUP_KINDS = {
            coin: { img: 'items_coin_gold', value: 1,  w: 24, h: 24, sfx: 'sfx_coin' },
            gem:  { img: 'items_gem_blue',  value: 5,  w: 24, h: 24, sfx: 'sfx_pickup' },
            star: { img: 'items_star',      value: 10, w: 28, h: 28, sfx: 'sfx_levelup' },
        };

        class Pickup {
            constructor(x, y, kind) {
                const def = PICKUP_KINDS[kind];
                this.x = x; this.y = y;
                this.width = def.w; this.height = def.h;
                this.kind = kind; this.def = def;
                this.collected = false;
            }
            draw(ctx) {
                if (this.collected) return;
                drawTile(ctx, IMG[this.def.img], this.x, this.y, this.width, this.height);
            }
            tryPickup(p) {
                if (this.collected) return 0;
                const hit = p.x < this.x + this.width && p.x + p.width > this.x
                         && p.y < this.y + this.height && p.y + p.height > this.y;
                if (!hit) return 0;
                this.collected = true;
                play(this.def.sfx);
                return this.def.value;
            }
        }

        // ============================================
        // ENEMY CLASS (slime patrol / fly hover)
        // ============================================
        class Enemy {
            constructor(x, y, type, patrol) {
                this.x = x; this.y = y;
                this.width = 36; this.height = 36;
                this.type = type;
                this.patrol = patrol;
                this.startX = x;
                this.dir = 1;
                this.vx = type === 'fly' ? 1.4 : 1;
                this.alive = true;
                this.deadTimer = 0;
                this.frame = 0;
                this.tick = 0;
            }
            update() {
                if (!this.alive) {
                    if (this.deadTimer > 0) this.deadTimer--;
                    return;
                }
                this.x += this.vx * this.dir;
                if (this.x > this.startX + this.patrol) { this.x = this.startX + this.patrol; this.dir = -1; }
                if (this.x < this.startX)               { this.x = this.startX;               this.dir =  1; }
                this.tick++;
                if (this.tick > 12) { this.tick = 0; this.frame = (this.frame + 1) % 2; }
            }
            draw(ctx) {
                if (!this.alive) {
                    if (this.deadTimer > 0 && this.type === 'slime' && IMG.enemy_slime_dead) {
                        drawTile(ctx, IMG.enemy_slime_dead, this.x, this.y + 8, this.width, this.height - 8);
                    }
                    return;
                }
                const img = IMG[`enemy_${this.type}_walk${this.frame + 1}`];
                if (!img) return;
                ctx.save();
                if (this.dir === -1) {
                    ctx.translate(this.x + this.width, this.y);
                    ctx.scale(-1, 1);
                    drawTile(ctx, img, 0, 0, this.width, this.height);
                } else {
                    drawTile(ctx, img, this.x, this.y, this.width, this.height);
                }
                ctx.restore();
            }
            // Returns 'stomp' (player landed on top) | 'hurt' (side hit) | null
            checkPlayer(p) {
                if (!this.alive) return null;
                const hit = p.x < this.x + this.width && p.x + p.width > this.x
                         && p.y < this.y + this.height && p.y + p.height > this.y;
                if (!hit) return null;
                const playerBottom = p.y + p.height;
                if (p.vy > 0 && playerBottom < this.y + 20) {
                    this.alive = false;
                    this.deadTimer = 60;
                    return 'stomp';
                }
                return 'hurt';
            }
        }

        // ============================================
        // FLAG CLASS (win condition)
        // ============================================
        class Flag {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 40; this.height = 40;
            }
            draw(ctx) {
                drawTile(ctx, IMG.items_flag_green, this.x, this.y, this.width, this.height);
            }
            checkPlayer(p) {
                return p.x < this.x + this.width && p.x + p.width > this.x
                    && p.y < this.y + this.height && p.y + p.height > this.y;
            }
        }

        // ============================================
        // PLAYER CLASS
        // ============================================
        class Player {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 36; this.height = 48;
                this.vx = 0; this.vy = 0;
                this.SPEED = 5;
                this.JUMP_FORCE = -12;
                this.GRAVITY = 0.5;
                this.isOnGround = false;
                this.facing = 1;
                this.walkFrame = 0;
                this.walkTick = 0;
                this.score = 0;
                this.coins = 0;
                this.gems = 0;
                this.hp = 3;
                this.iframes = 0;
                this.knockback = 0;
            }
            update(platforms, pickups, enemies, flag) {
                this.vx = 0;
                if (keys.left)  { this.vx = -this.SPEED; this.facing = -1; }
                if (keys.right) { this.vx =  this.SPEED; this.facing =  1; }
                if (this.knockback !== 0) {
                    this.vx = this.knockback;
                    this.knockback *= 0.85;
                    if (Math.abs(this.knockback) < 0.5) this.knockback = 0;
                }
                if (keys.up && this.isOnGround) {
                    this.vy = this.JUMP_FORCE;
                    this.isOnGround = false;
                    play('sfx_jump');
                }

                this.vy += this.GRAVITY;
                this.x += this.vx;
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > WORLD_WIDTH) this.x = WORLD_WIDTH - this.width;

                this.y += this.vy;
                this.isOnGround = false;
                for (const plat of platforms) {
                    if (plat.checkCollision(this)) {
                        if (this.vy > 0) {
                            this.y = plat.y - this.height;
                            this.vy = 0;
                            this.isOnGround = true;
                        } else if (this.vy < 0) {
                            this.y = plat.y + plat.height;
                            this.vy = 0;
                        }
                    }
                }

                // pit fall = lose 1 HP and respawn (or die)
                if (this.y > WORLD_HEIGHT + 200) {
                    this.takeHit(0);
                    if (this.hp > 0) {
                        this.x = LEVEL_DATA.playerSpawn.x;
                        this.y = LEVEL_DATA.playerSpawn.y;
                        this.vy = 0;
                    }
                }

                if (this.isOnGround && this.vx !== 0) {
                    this.walkTick++;
                    if (this.walkTick > 4) {
                        this.walkTick = 0;
                        this.walkFrame = (this.walkFrame + 1) % MANIFEST.player.animations.walk.length;
                    }
                } else {
                    this.walkFrame = 0;
                }

                for (const pk of pickups) {
                    const v = pk.tryPickup(this);
                    if (v > 0) {
                        this.score += v;
                        if (pk.kind === 'coin') this.coins++;
                        else if (pk.kind === 'gem') this.gems++;
                    }
                }

                if (this.iframes > 0) this.iframes--;
                for (const e of enemies) {
                    const r = e.checkPlayer(this);
                    if (r === 'stomp') {
                        this.vy = -8;
                        play('sfx_pickup');
                        this.score += 2;
                    } else if (r === 'hurt' && this.iframes <= 0) {
                        this.takeHit(this.x < e.x ? -6 : 6);
                    }
                }

                if (flag.checkPlayer(this)) state = 'won';
            }
            takeHit(kbVx) {
                this.hp--;
                this.iframes = 90;
                this.knockback = kbVx;
                this.vy = -6;
                if (this.hp <= 0) state = 'dead';
            }
            draw(ctx) {
                // flicker during i-frames
                if (this.iframes > 0 && Math.floor(this.iframes / 6) % 2 === 0) return;
                const anims = MANIFEST.player.animations;
                let frame;
                if (!this.isOnGround)        frame = anims.jump;
                else if (this.vx !== 0)      frame = anims.walk[this.walkFrame];
                else                         frame = anims.stand;

                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(this.x + this.width, this.y);
                    ctx.scale(-1, 1);
                    drawSheetFrame(ctx, IMG.player_sheet, frame, 0, 0, this.width, this.height);
                } else {
                    drawSheetFrame(ctx, IMG.player_sheet, frame, this.x, this.y, this.width, this.height);
                }
                ctx.restore();
            }
        }

        // ============================================
        // CAMERA (side-scroll)
        // ============================================
        let cameraX = 0;
        function updateCamera(player) {
            const target = player.x + player.width / 2 - VIEW_WIDTH / 2;
            cameraX = Math.max(0, Math.min(WORLD_WIDTH - VIEW_WIDTH, target));
        }

        // ============================================
        // BACKGROUND (parallax clouds)
        // ============================================
        function drawBackground(ctx) {
            const g = ctx.createLinearGradient(0, 0, 0, WORLD_HEIGHT);
            g.addColorStop(0, '#87CEEB');
            g.addColorStop(1, '#cfe9f5');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, VIEW_WIDTH, WORLD_HEIGHT);

            const offset = (cameraX * 0.3) % 400;
            for (let i = -1; i < 5; i++) {
                const x = i * 400 - offset;
                drawTile(ctx, IMG.items_cloud, x + 80,  60, 120, 60);
                drawTile(ctx, IMG.items_cloud, x + 240, 100, 100, 50);
            }
        }

        // ============================================
        // HUD + OVERLAYS
        // ============================================
        function drawHud(ctx, player) {
            // hearts (top-left)
            for (let i = 0; i < 3; i++) {
                const img = i < player.hp ? IMG.hud_heart_full : IMG.hud_heart_empty;
                drawTile(ctx, img, 12 + i * 32, 12, 28, 28);
            }
            // coin counter (top-right)
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.font = 'bold 22px "Courier New", monospace';
            drawTile(ctx, IMG.hud_coin_icon, VIEW_WIDTH - 200, 12, 28, 28);
            const coinTxt = 'x ' + player.coins;
            ctx.strokeText(coinTxt, VIEW_WIDTH - 165, 34);
            ctx.fillText(coinTxt,  VIEW_WIDTH - 165, 34);
            const scoreTxt = 'SCORE ' + player.score;
            ctx.strokeText(scoreTxt, VIEW_WIDTH - 110, 34);
            ctx.fillText(scoreTxt,  VIEW_WIDTH - 110, 34);
            ctx.font = 'bold 16px "Courier New", monospace';
            const gemTxt = 'GEMS ' + player.gems;
            ctx.strokeText(gemTxt, VIEW_WIDTH - 200, 60);
            ctx.fillText(gemTxt,  VIEW_WIDTH - 200, 60);
        }

        function drawAudioGate(ctx) {
            // dim the world a touch so the prompt reads
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(0, 0, VIEW_WIDTH, WORLD_HEIGHT);
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.textAlign = 'center';
            ctx.font = 'bold 32px "Courier New", monospace';
            ctx.strokeText('🔊 Press any key to start', VIEW_WIDTH / 2, WORLD_HEIGHT / 2);
            ctx.fillText('🔊 Press any key to start',  VIEW_WIDTH / 2, WORLD_HEIGHT / 2);
            ctx.textAlign = 'start';
        }

        function drawStateOverlay(ctx, kind, player) {
            ctx.fillStyle = kind === 'won' ? 'rgba(40,80,30,0.78)' : 'rgba(80,20,20,0.78)';
            ctx.fillRect(0, 0, VIEW_WIDTH, WORLD_HEIGHT);
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.textAlign = 'center';
            ctx.font = 'bold 56px "Courier New", monospace';
            const title = kind === 'won' ? 'YOU WIN!' : 'GAME OVER';
            ctx.strokeText(title, 400, 240);
            ctx.fillText(title,  400, 240);
            ctx.font = 'bold 22px "Courier New", monospace';
            const sub = `Score ${player.score}    Coins ${player.coins}    Gems ${player.gems}`;
            ctx.strokeText(sub, 400, 295);
            ctx.fillText(sub,  400, 295);
            ctx.font = '20px "Courier New", monospace';
            ctx.strokeText('Press R to restart', 400, 360);
            ctx.fillText('Press R to restart',  400, 360);
            ctx.textAlign = 'start';
        }

        // ============================================
        // STATE + RESTART
        // ============================================
        let state = 'playing';
        let player, platforms, pickups, enemies, flag;
        let dungeonMusicTriggered = false;
        let endStateAudioPlayed = false;

        function buildLevel() {
            platforms = LEVEL_DATA.platforms.map(p => new Platform(p.x, p.y, p.w));
            pickups   = LEVEL_DATA.pickups.map(p => new Pickup(p.x, p.y, p.kind));
            enemies   = LEVEL_DATA.enemies.map(e => new Enemy(e.x, e.y, e.type, e.patrol));
            flag      = new Flag(LEVEL_DATA.flag.x, LEVEL_DATA.flag.y);
            player    = new Player(LEVEL_DATA.playerSpawn.x, LEVEL_DATA.playerSpawn.y);
            cameraX = 0;
            state = 'playing';
            dungeonMusicTriggered = false;
            endStateAudioPlayed = false;
            stopAllMusic();
            playMusic('town');
        }

        function tickRestart() {
            if (!restartRequested) return;
            restartRequested = false;
            if (state === 'dead' || state === 'won') buildLevel();
        }

        // ============================================
        // GAME LOOP
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function gameLoop() {
            drawBackground(ctx);

            if (state === 'playing') {
                player.update(platforms, pickups, enemies, flag);
                for (const e of enemies) e.update();
                updateCamera(player);

                if (!dungeonMusicTriggered && cameraX > 3000) {
                    dungeonMusicTriggered = true;
                    crossfadeTo('dungeon');
                }
            } else if (!endStateAudioPlayed) {
                endStateAudioPlayed = true;
                stopAllMusic();
                if (state === 'dead') playMusic('game_over');
                else if (state === 'won') play('sfx_win');
            }

            // world drawing wrapped in camera transform
            ctx.save();
            ctx.translate(-cameraX, 0);
            for (const plat of platforms) plat.draw(ctx);
            for (const pk of pickups)     pk.draw(ctx);
            for (const e of enemies)      e.draw(ctx);
            flag.draw(ctx);
            player.draw(ctx);
            ctx.restore();

            // screen-space HUD + state overlay
            drawHud(ctx, player);
            if (!audioUnlocked) drawAudioGate(ctx);
            if (state !== 'playing') drawStateOverlay(ctx, state, player);

            tickRestart();
            requestAnimationFrame(gameLoop);
        }

        async function boot() {
            try {
                MANIFEST = await fetch('assets/manifest.json').then(r => r.json());
                await loadAllImages(MANIFEST);
                loadAllSounds(MANIFEST);
                if (MISSING_ASSETS.length > 0) {
                    const preview = MISSING_ASSETS.slice(0, 8).join('\n  ');
                    const more = MISSING_ASSETS.length > 8 ? `\n  ...and ${MISSING_ASSETS.length - 8} more` : '';
                    _errorOverlay.warn(`Missing assets (${MISSING_ASSETS.length}):\n  ${preview}${more}`);
                }
                buildLevel();
                gameLoop();
            } catch (err) {
                _errorOverlay.error('Boot failed: ' + err.message);
                console.error(err);
            }
        }

        boot();
    </script>
</body>
</html>
