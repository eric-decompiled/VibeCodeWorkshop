<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Platformer Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100vw;
        }

        #gameCanvas {
            background-color: #87CEEB;
            border: 4px solid #228B22;
            box-shadow: 0 0 20px rgba(34, 139, 34, 0.3);
            max-width: 100%;
            height: auto;
        }

    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div style="margin-top:8px;font-size:12px;color:#555;">
            <a href="demo.html" style="color:#228B22;">sprite demo</a>
            &middot;
            <a href="gallery.html" style="color:#228B22;">asset gallery</a>
        </div>
    </div>

    <script>
        // ============================================
        // ERROR OVERLAY
        // ============================================
        // Surfaces uncaught JS errors visibly so you don't need DevTools open.
        // If your game suddenly stops, look here for what broke and where.
        (function () {
            const overlay = document.createElement('div');
            overlay.style.cssText =
                'position:fixed;top:0;left:0;right:0;background:rgba(180,30,30,0.92);' +
                'color:#fff;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;' +
                'padding:8px 12px;white-space:pre-wrap;z-index:9999;display:none;' +
                'max-height:40vh;overflow:auto;';
            document.body.appendChild(overlay);
            function show(msg) {
                overlay.style.display = 'block';
                overlay.textContent += msg + '\n';
            }
            window.addEventListener('error', e => show(
                `Error: ${e.message}\n  at ${e.filename || '?'}:${e.lineno || '?'}:${e.colno || '?'}`
            ));
            window.addEventListener('unhandledrejection', e => show(
                `Unhandled promise rejection: ${e.reason}`
            ));
        })();

        // ============================================
        // SOUND
        // ============================================
        const SND = {};
        function loadAudio(key, src, loop = false) {
            const a = new Audio(src);
            a.loop = loop;
            SND[key] = a;
        }
        loadAudio('sfx_jump',    '../assets/sfx/jump.ogg');
        loadAudio('sfx_coin',    '../assets/sfx/coin.ogg');
        loadAudio('sfx_pickup',  '../assets/sfx/pickup.ogg');
        loadAudio('sfx_levelup', '../assets/sfx/levelup.ogg');
        loadAudio('sfx_hurt',    '../assets/sfx/key.ogg');
        loadAudio('music',       '../assets/music/retro.mp3', true);

        function play(key) {
            const s = SND[key];
            if (!s) return;
            s.currentTime = 0;
            s.play().catch(() => {});
        }

        // Start music on first interaction
        let musicStarted = false;
        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            SND['music'].volume = 0.4;
            SND['music'].play().catch(() => {});
        }
        window.addEventListener('keydown', startMusic, { once: true });

        // ============================================
        // SWORDS
        // ============================================
        const SWORDS = [
            { id: 'iron',    name: 'Iron Sword',    cost: 0,   blade: '#C0C0C0', guard: '#DAA520', reach: 44, length: 36 },
            { id: 'fire',    name: 'Fire Sword',    cost: 10,  blade: '#FF4500', guard: '#FF8C00', reach: 54, length: 42 },
            { id: 'ice',     name: 'Ice Sword',     cost: 15,  blade: '#00CFFF', guard: '#007ACC', reach: 50, length: 40 },
            { id: 'golden',  name: 'Golden Sword',  cost: 25,  blade: '#FFD700', guard: '#FFA500', reach: 48, length: 38 },
            { id: 'giant',   name: 'Giant Sword',   cost: 40,  blade: '#9B59B6', guard: '#6C3483', reach: 70, length: 56 },
        ];
        let equippedSword = SWORDS[0];
        const ownedSwords = new Set(['iron']);

        // ============================================
        // WORLD
        // ============================================
        let cameraX = 0;

        // ============================================
        // INPUT HANDLING
        // ============================================
        const keys = {
            left: false,
            right: false,
            up: false,
            attack: false
        };

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    keys.left = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    keys.right = true;
                    break;
                case 'ArrowUp':
                case 'KeyW':
                    keys.up = true;
                    e.preventDefault();
                    break;
                case 'Space':
                    keys.attack = true;
                    e.preventDefault();
                    break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    keys.left = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    keys.right = false;
                    break;
                case 'ArrowUp':
                case 'KeyW':
                    keys.up = false;
                    break;
                case 'Space':
                    keys.attack = false;
                    break;
            }
        });

        // ============================================
        // PLATFORM CLASS
        // ============================================
        class Platform {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw(ctx) {
                // Brown dirt/earth
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Green grass top
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(this.x, this.y, this.width, 6);
            }

            checkCollision(player) {
                return (
                    player.x < this.x + this.width &&
                    player.x + player.width > this.x &&
                    player.y < this.y + this.height &&
                    player.y + player.height > this.y
                );
            }
        }

        // ============================================
        // PROCEDURAL LEVEL GENERATOR
        // ============================================
        const platforms = [];
        const enemies = [];
        const coins = [];
        let score = 0;
        let genX = 0;   // how far right we've generated
        let rngSeed = 1;

        function rng() {
            rngSeed = (rngSeed * 1664525 + 1013904223) & 0xffffffff;
            return (rngSeed >>> 0) / 0xffffffff;
        }

        function generateChunk(startX) {
            // Ground segment with gap after
            const groundW = 220 + Math.floor(rng() * 180);
            platforms.push(new Platform(startX, 550, groundW, 50));

            // 1–3 floating platforms above this ground chunk
            const floatCount = 1 + Math.floor(rng() * 3);
            for (let i = 0; i < floatCount; i++) {
                const fw = 100 + Math.floor(rng() * 120);
                const fx = startX + Math.floor(rng() * Math.max(10, groundW - fw));
                const fy = 160 + Math.floor(rng() * 340);
                platforms.push(new Platform(fx, fy, fw, 20));

                // Coins hovering above the platform
                const coinCount = 2 + Math.floor(rng() * 4);
                for (let c = 0; c < coinCount; c++) {
                    coins.push({ x: fx + 10 + c * 28, y: fy - 28, collected: false });
                }

                // Sometimes put an enemy on a floating platform
                if (rng() < 0.5) {
                    const color = rng() < 0.3 ? '#F1C40F' : '#E74C3C';
                    enemies.push(new Enemy(fx + 10, fy - 30, Math.min(fw - 20, 80 + Math.floor(rng() * 60)), color));
                }
            }

            // Ground enemy
            if (rng() < 0.6) {
                const color = rng() < 0.25 ? '#F1C40F' : '#E74C3C';
                enemies.push(new Enemy(startX + 20, 520, groundW - 40, color));
            }

            // A few coins on the ground
            const groundCoins = 1 + Math.floor(rng() * 3);
            for (let c = 0; c < groundCoins; c++) {
                coins.push({ x: startX + 30 + Math.floor(rng() * (groundW - 60)), y: 522, collected: false });
            }

            // Spawn a shop every 4 ground chunks
            shopChunkCounter++;
            if (shopChunkCounter % 4 === 0) {
                spawnShop(startX + Math.floor(groundW / 2) - 24, 494);
            }

            // Gap width then next chunk
            const gap = 40 + Math.floor(rng() * 80);
            return startX + groundW + gap;
        }

        // Seed call moved to after Enemy/Player classes are defined

        // ============================================
        // ENEMY CLASS
        // ============================================
        class Enemy {
            constructor(x, y, patrolWidth = 120, color = '#E74C3C') {
                this.x = x;
                this.y = y;
                this.width = 36;
                this.height = 30;
                this.vx = 1.5;
                this.startX = x;
                this.patrolWidth = patrolWidth;
                this.tick = 0;
                this.dead = false;
                this.deadTimer = 0;
                this.color = color;
                this.colorDark = color === '#F1C40F' ? '#B7950B' : '#C0392B';
            }

            update() {
                if (this.dead) { this.deadTimer++; return; }
                this.x += this.vx;
                if (this.x > this.startX + this.patrolWidth) this.vx = -Math.abs(this.vx);
                if (this.x < this.startX)                    this.vx =  Math.abs(this.vx);
                this.tick++;
            }

            draw(ctx) {
                if (this.dead) {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(this.x, this.y + 20, this.width, 10);
                    return;
                }
                // Body
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y + 8, this.width, this.height - 8);
                // Head
                ctx.fillRect(this.x + 6, this.y, 24, 18);
                // Eyes (angry)
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 8,  this.y + 4, 7, 6);
                ctx.fillRect(this.x + 20, this.y + 4, 7, 6);
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x + 10, this.y + 6, 3, 3);
                ctx.fillRect(this.x + 22, this.y + 6, 3, 3);
                // Angry brows
                ctx.fillStyle = this.colorDark;
                ctx.fillRect(this.x + 7,  this.y + 2, 9, 3);
                ctx.fillRect(this.x + 19, this.y + 2, 9, 3);
                // Legs (wiggle)
                const legOffset = Math.sin(this.tick * 0.2) * 3;
                ctx.fillStyle = this.colorDark;
                ctx.fillRect(this.x + 6,  this.y + this.height - 2, 8, 4 + legOffset);
                ctx.fillRect(this.x + 20, this.y + this.height - 2, 8, 4 - legOffset);
            }

            collide(player) {
                if (this.dead) return null;
                const hit = player.x < this.x + this.width && player.x + player.width > this.x
                         && player.y < this.y + this.height && player.y + player.height > this.y;
                if (!hit) return null;
                if (player.vy > 0 && player.y + player.height < this.y + 16) return 'stomp';
                return 'hurt';
            }
        }


        // ============================================
        // PLAYER CLASS
        // ============================================
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 48;
                this.vx = 0;
                this.vy = 0;
                this.SPEED = 5;
                this.JUMP_FORCE = -12;
                this.GRAVITY = 0.5;
                this.isOnGround = false;
                this.facingLeft = false;
                this.attackTimer = 0;
                this.ATTACK_DURATION = 18;
            }

            update(platforms) {
                this.vx = 0;
                if (keys.left) { this.vx = -this.SPEED; this.facingLeft = true; }
                if (keys.right) { this.vx = this.SPEED; this.facingLeft = false; }

                if (keys.up && this.isOnGround) {
                    this.vy = this.JUMP_FORCE;
                    play('sfx_jump');
                    this.isOnGround = false;
                }

                this.vy += this.GRAVITY;
                this.x += this.vx;

                if (this.x < 0) this.x = 0;
                // no right-edge clamp — level is infinite

                this.y += this.vy;
                this.isOnGround = false;

                for (const platform of platforms) {
                    if (platform.checkCollision(this)) {
                        if (this.vy > 0) {
                            this.y = platform.y - this.height;
                            this.vy = 0;
                            this.isOnGround = true;
                        } else if (this.vy < 0) {
                            this.y = platform.y + platform.height;
                            this.vy = 0;
                        }
                    }
                }

                if (this.y > 600) {
                    this.x = 100;
                    this.y = 500;
                    this.vy = 0;
                }

                if (keys.attack && this.attackTimer === 0) this.attackTimer = this.ATTACK_DURATION;
                if (this.attackTimer > 0) this.attackTimer--;

            }

            draw(ctx) {
                ctx.fillStyle = '#27AE60';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Name tag
                ctx.font = 'bold 13px "Comic Sans MS", cursive';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#FFD700';
                ctx.fillText('Zorp', this.x + this.width / 2, this.y - 28);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 0.5;
                ctx.strokeText('Zorp', this.x + this.width / 2, this.y - 28);

                // Tall silly top hat
                ctx.fillStyle = '#8E44AD';
                ctx.fillRect(this.x + 4, this.y - 22, 24, 22);  // crown
                ctx.fillRect(this.x - 2, this.y - 4, 36, 5);    // brim
                // Hat band
                ctx.fillStyle = '#F1C40F';
                ctx.fillRect(this.x + 4, this.y - 8, 24, 4);
                // Flower on band
                ctx.fillStyle = '#E74C3C';
                ctx.fillRect(this.x + 20, this.y - 9, 5, 5);
                ctx.fillStyle = '#F9E79F';
                ctx.fillRect(this.x + 21, this.y - 8, 3, 3);

                // Sunglasses frame
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x + 5, this.y + 12, 9, 7);
                ctx.fillRect(this.x + 17, this.y + 12, 9, 7);
                ctx.fillRect(this.x + 14, this.y + 13, 3, 2); // bridge
                // Lenses
                ctx.fillStyle = '#1ABC9C';
                ctx.fillRect(this.x + 6, this.y + 13, 7, 5);
                ctx.fillRect(this.x + 18, this.y + 13, 7, 5);
            }
        }

        // ============================================
        // CAT CLASS
        // ============================================
        class Cat {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 24;
                this.height = 18;
                this.SPEED = 2.5;
                this.facingLeft = false;
            }

            update(player, platforms) {
                const targetX = player.x + player.width / 2 - this.width / 2;
                const targetY = player.y + player.height - this.height;
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 40) {
                    this.x += (dx / dist) * this.SPEED;
                    this.y += (dy / dist) * this.SPEED;
                    this.facingLeft = dx < 0;
                }

                // Clamp to world
                if (this.x < 0) this.x = 0;
                // no right-edge clamp — level is infinite
            }

            draw(ctx) {
                const x = this.x, y = this.y;
                // Body
                ctx.fillStyle = '#E8A87C';
                ctx.fillRect(x, y + 4, this.width, this.height - 4);
                // Head
                ctx.fillRect(x + 4, y, 16, 14);
                // Ears
                ctx.beginPath();
                ctx.moveTo(x + 5, y);
                ctx.lineTo(x + 2, y - 6);
                ctx.lineTo(x + 10, y);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 14, y);
                ctx.lineTo(x + 22, y - 6);
                ctx.lineTo(x + 19, y);
                ctx.fill();
                // Tail
                ctx.beginPath();
                ctx.moveTo(this.facingLeft ? x + this.width : x, y + this.height - 4);
                const tailDir = this.facingLeft ? 1 : -1;
                ctx.quadraticCurveTo(
                    x + this.width / 2 + tailDir * 20, y + this.height + 8,
                    x + this.width / 2 + tailDir * 14, y + this.height - 2
                );
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#E8A87C';
                ctx.stroke();
                // Eyes
                ctx.fillStyle = '#333';
                ctx.fillRect(x + 7, y + 4, 3, 3);
                ctx.fillRect(x + 14, y + 4, 3, 3);
                // Nose
                ctx.fillStyle = '#FF9999';
                ctx.fillRect(x + 11, y + 8, 2, 2);

                // Sword
                const sw = equippedSword;
                const swinging = this.attackTimer > 0;
                const swingProgress = swinging ? 1 - (this.attackTimer / this.ATTACK_DURATION) : 0;
                const swingAngle = this.facingLeft
                    ? Math.PI + swingProgress * 1.4
                    : -0.3 - swingProgress * 1.4;
                const swordX = this.facingLeft ? x + 4 : x + this.width - 4;
                const swordY = y + 24;
                ctx.save();
                ctx.translate(swordX, swordY);
                ctx.rotate(swingAngle);
                ctx.fillStyle = sw.blade;
                ctx.fillRect(-3, -sw.length, 6, sw.length);
                ctx.fillStyle = sw.blade;
                ctx.fillRect(-2, -sw.length - 5, 4, 7);
                ctx.fillStyle = sw.guard;
                ctx.fillRect(-9, -4, 18, 5);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-2, 0, 4, 12);
                ctx.restore();
            }
        }

        // ============================================
        // FIRE PARTICLES
        // ============================================
        const fireParticles = [];

        function spawnFire(player) {
            const mouthX = player.facingLeft ? player.x : player.x + player.width;
            const mouthY = player.y + 22;
            const dir = player.facingLeft ? -1 : 1;
            for (let i = 0; i < 3; i++) {
                fireParticles.push({
                    x: mouthX,
                    y: mouthY + (Math.random() - 0.5) * 4,
                    vx: dir * (3 + Math.random() * 4),
                    vy: (Math.random() - 0.5) * 2,
                    life: 1.0,
                    size: 6 + Math.random() * 6,
                });
            }
        }

        function updateFire(player) {
            spawnFire(player);
            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const p = fireParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.size *= 0.92;
                p.life -= 0.045;
                if (p.life <= 0) fireParticles.splice(i, 1);
            }
        }

        function drawFire(ctx) {
            for (const p of fireParticles) {
                const r = Math.floor(255);
                const g = Math.floor(p.life * 180);
                ctx.globalAlpha = p.life * 0.85;
                ctx.fillStyle = `rgb(${r},${g},0)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ============================================
        // BUNNY CLASS
        // ============================================
        class Bunny {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 20;
                this.height = 22;
                this.vx = 0;
                this.vy = 0;
                this.GRAVITY = 0.6;
                this.hopTick = 0;
                this.facingLeft = false;
                this.isOnGround = false;
            }

            update(player, platforms) {
                const targetX = player.x + player.width / 2 - this.width / 2 - 50;
                const dx = targetX - this.x;

                this.hopTick++;
                // Hop toward player every 40 frames if far enough away
                if (this.hopTick >= 22 && Math.abs(dx) > 30 && this.isOnGround) {
                    this.vx = (dx / Math.abs(dx)) * 8;
                    this.vy = -11;
                    this.isOnGround = false;
                    this.hopTick = 0;
                }

                this.facingLeft = dx < 0;
                this.vy += this.GRAVITY;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.85;
                this.isOnGround = false;

                for (const p of platforms) {
                    if (this.x < p.x + p.width && this.x + this.width > p.x &&
                        this.y < p.y + p.height && this.y + this.height > p.y) {
                        if (this.vy > 0) {
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.isOnGround = true;
                        }
                    }
                }

                if (this.y > 600) { this.y = 500; this.vy = 0; }
                if (this.x < 0) this.x = 0;
                // no right-edge clamp — level is infinite
            }

            draw(ctx) {
                const x = this.x, y = this.y;
                const squish = this.isOnGround ? 1 : 0.85;
                ctx.fillStyle = '#F0F0F0';
                // Body
                ctx.fillRect(x, y + 8 * squish, this.width, this.height - 8);
                // Head
                ctx.fillRect(x + 2, y + 2, 16, 14);
                // Tall ears
                ctx.fillRect(x + 3,  y - 10, 5, 14);
                ctx.fillRect(x + 12, y - 10, 5, 14);
                // Inner ears
                ctx.fillStyle = '#FFB6C1';
                ctx.fillRect(x + 4,  y - 8, 3, 10);
                ctx.fillRect(x + 13, y - 8, 3, 10);
                // Eye
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(x + 5, y + 5, 3, 3);
                ctx.fillRect(x + 12, y + 5, 3, 3);
                // Nose
                ctx.fillStyle = '#FFB6C1';
                ctx.fillRect(x + 8, y + 9, 4, 3);
                // Tail
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.facingLeft ? x + this.width + 2 : x - 2, y + this.height - 6, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ============================================
        // DOG CLASS
        // ============================================
        class Dog {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 28;
                this.height = 20;
                this.SPEED = 3;
                this.facingLeft = false;
                this.tailWag = 0;
            }

            update(player, platforms) {
                const targetX = player.x + player.width / 2 - this.width / 2 + 44;
                const targetY = player.y + player.height - this.height;
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 50) {
                    this.x += (dx / dist) * this.SPEED;
                    this.y += (dy / dist) * this.SPEED;
                    this.facingLeft = dx < 0;
                }

                this.tailWag += 0.2;
                if (this.x < 0) this.x = 0;
                // no right-edge clamp — level is infinite
            }

            draw(ctx) {
                const x = this.x, y = this.y;
                ctx.fillStyle = '#C68642';
                // Body
                ctx.fillRect(x, y + 6, this.width, this.height - 6);
                // Head
                ctx.fillRect(x + (this.facingLeft ? 0 : 8), y, 18, 16);
                // Floppy ears
                ctx.fillStyle = '#A0522D';
                if (this.facingLeft) {
                    ctx.fillRect(x + 14, y + 2, 6, 10);
                } else {
                    ctx.fillRect(x + 8, y + 2, 6, 10);
                }
                // Nose
                ctx.fillStyle = '#333';
                ctx.fillRect(this.facingLeft ? x + 1 : x + 22, y + 7, 4, 3);
                // Eye
                ctx.fillStyle = '#222';
                ctx.fillRect(this.facingLeft ? x + 8 : x + 14, y + 3, 3, 3);
                // Wagging tail
                const wag = Math.sin(this.tailWag) * 8;
                ctx.beginPath();
                ctx.moveTo(this.facingLeft ? x + this.width : x, y + 8);
                ctx.quadraticCurveTo(
                    this.facingLeft ? x + this.width + 10 : x - 10, y + wag,
                    this.facingLeft ? x + this.width + 6 : x - 6, y - 4 + wag
                );
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#C68642';
                ctx.stroke();
                // Legs
                ctx.fillStyle = '#C68642';
                ctx.fillRect(x + 4,  y + this.height - 4, 5, 4);
                ctx.fillRect(x + 18, y + this.height - 4, 5, 4);
            }
        }

        // ============================================
        // SHOP
        // ============================================
        const shops = [];
        let shopChunkCounter = 0;
        let shopOpen = false;
        let shopSelected = 0;

        class Shop {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 48; this.height = 56;
            }
            draw(ctx) {
                // Stall
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y + 20, this.width, this.height - 20);
                // Roof
                ctx.fillStyle = '#E74C3C';
                ctx.fillRect(this.x - 6, this.y + 12, this.width + 12, 12);
                // Sign
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(this.x + 8, this.y + 28, this.width - 16, 18);
                ctx.fillStyle = '#333';
                ctx.font = 'bold 9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SHOP', this.x + this.width / 2, this.y + 41);
                // Prompt if player nearby
                if (shopOpen) return;
                ctx.fillStyle = '#fff';
                ctx.font = '11px monospace';
                ctx.fillText('[E] enter', this.x + this.width / 2, this.y + 8);
            }
        }

        function spawnShop(x, y) { shops.push(new Shop(x, y)); }

        function nearShop(player) {
            for (const s of shops) {
                if (Math.abs(player.x - s.x) < 80 && Math.abs(player.y - s.y) < 80) return true;
            }
            return false;
        }

        function drawShopUI(ctx) {
            if (!shopOpen) return;
            // Backdrop
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(100, 60, 600, 420);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.strokeRect(100, 60, 600, 420);
            // Title
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 22px "Comic Sans MS", cursive';
            ctx.textAlign = 'center';
            ctx.fillText("⚔  Zorp's Sword Shop  ⚔", 400, 100);
            ctx.fillStyle = '#aaa';
            ctx.font = '13px monospace';
            ctx.fillText('↑ ↓ navigate   ENTER buy   E close', 400, 122);
            // Sword list
            SWORDS.forEach((sw, i) => {
                const row = 150 + i * 62;
                const owned = ownedSwords.has(sw.id);
                const equipped = equippedSword.id === sw.id;
                const sel = i === shopSelected;
                ctx.fillStyle = sel ? 'rgba(255,215,0,0.18)' : 'rgba(255,255,255,0.05)';
                ctx.fillRect(120, row, 560, 54);
                if (sel) { ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2; ctx.strokeRect(120, row, 560, 54); }
                // Sword colour swatch
                ctx.fillStyle = sw.blade;
                ctx.fillRect(138, row + 12, 30, 8);
                ctx.fillStyle = sw.guard;
                ctx.fillRect(132, row + 18, 42, 5);
                // Name + stats
                ctx.fillStyle = equipped ? '#FFD700' : '#fff';
                ctx.font = `bold 15px monospace`;
                ctx.textAlign = 'left';
                ctx.fillText(sw.name, 190, row + 22);
                ctx.fillStyle = '#aaa';
                ctx.font = '12px monospace';
                ctx.fillText(`reach: ${sw.reach}   length: ${sw.length}`, 190, row + 40);
                // Status / price
                ctx.textAlign = 'right';
                if (equipped) {
                    ctx.fillStyle = '#27AE60'; ctx.font = 'bold 13px monospace';
                    ctx.fillText('EQUIPPED', 660, row + 22);
                } else if (owned) {
                    ctx.fillStyle = '#3498DB'; ctx.font = 'bold 13px monospace';
                    ctx.fillText('OWNED — press ENTER to equip', 660, row + 22);
                } else {
                    ctx.fillStyle = score >= sw.cost ? '#FFD700' : '#E74C3C';
                    ctx.font = 'bold 13px monospace';
                    ctx.fillText(`🪙 ${sw.cost}`, 660, row + 22);
                }
            });
            // Footer
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`Your coins: 🪙 ${score}`, 400, 498);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyE') {
                if (!shopOpen && nearShop(player)) { shopOpen = true; shopSelected = 0; }
                else shopOpen = false;
            }
            if (!shopOpen) return;
            if (e.code === 'ArrowUp')   { shopSelected = (shopSelected - 1 + SWORDS.length) % SWORDS.length; e.preventDefault(); }
            if (e.code === 'ArrowDown') { shopSelected = (shopSelected + 1) % SWORDS.length; e.preventDefault(); }
            if (e.code === 'Enter') {
                const sw = SWORDS[shopSelected];
                if (ownedSwords.has(sw.id)) {
                    equippedSword = sw;
                } else if (score >= sw.cost) {
                    score -= sw.cost;
                    ownedSwords.add(sw.id);
                    equippedSword = sw;
                    play('sfx_levelup');
                } else {
                    play('sfx_hurt');
                }
                e.preventDefault();
            }
        });

        // ============================================
        // GAME LOOP
        // ============================================
        // Seed the first few chunks now that Enemy class is defined
        while (genX < 2400) genX = generateChunk(genX);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const player = new Player(100, 500);
        const cat = new Cat(60, 500);
        const dog = new Dog(150, 500);
        const bunny = new Bunny(200, 500);

        function gameLoop() {
            ctx.fillStyle = '#1565C0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!shopOpen) player.update(platforms);
            if (!shopOpen) cat.update(player, platforms);
            if (!shopOpen) dog.update(player, platforms);
            if (!shopOpen) bunny.update(player, platforms);
            if (!shopOpen) updateFire(player);

            for (const e of enemies) {
                e.update();
                // Sword hit: active during first half of swing
                if (player.attackTimer > player.ATTACK_DURATION / 2) {
                    const reachW = equippedSword.reach;
                    const reachX = player.facingLeft ? player.x - reachW : player.x + player.width;
                    const swordHit = reachX < e.x + e.width && reachX + reachW > e.x
                                  && player.y < e.y + e.height && player.y + player.height > e.y;
                    if (swordHit && !e.dead) { e.dead = true; play('sfx_levelup'); }
                }
                const hit = e.collide(player);
                if (hit === 'stomp') {
                    e.dead = true;
                    player.vy = -8;
                    play('sfx_pickup');
                } else if (hit === 'hurt') {
                    player.x = 100; player.y = 500; player.vy = 0;
                    play('sfx_hurt');
                }
            }
            for (let i = enemies.length - 1; i >= 0; i--)
                if (enemies[i].dead && enemies[i].deadTimer > 60) enemies.splice(i, 1);

            // Generate new chunks ahead of player
            while (genX < player.x + 1600) genX = generateChunk(genX);

            // Coin collection
            const cw = 16, ch = 16;
            for (const c of coins) {
                if (c.collected) continue;
                if (player.x < c.x + cw && player.x + player.width > c.x &&
                    player.y < c.y + ch && player.y + player.height > c.y) {
                    c.collected = true;
                    score++;
                    play('sfx_coin');
                }
            }

            // Cull platforms, enemies, and coins far behind player
            const cullX = player.x - 900;
            for (let i = platforms.length - 1; i >= 0; i--)
                if (platforms[i].x + platforms[i].width < cullX) platforms.splice(i, 1);
            for (let i = enemies.length - 1; i >= 0; i--)
                if (enemies[i].x + enemies[i].width < cullX) enemies.splice(i, 1);
            for (let i = coins.length - 1; i >= 0; i--)
                if (coins[i].x < cullX) coins.splice(i, 1);

            cameraX = player.x + player.width / 2 - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            // no right-edge camera clamp — level is infinite

            ctx.save();
            ctx.translate(-cameraX, 0);

            for (const platform of platforms) {
                platform.draw(ctx);
            }
            // Draw coins
            for (const c of coins) {
                if (c.collected) continue;
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(c.x + 8, c.y + 8, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.arc(c.x + 6, c.y + 6, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            for (const e of enemies) e.draw(ctx);
            for (const s of shops) s.draw(ctx);
            cat.draw(ctx);
            dog.draw(ctx);
            bunny.draw(ctx);
            drawFire(ctx);
            player.draw(ctx);

            ctx.restore();

            // Cull far-behind shops
            for (let i = shops.length - 1; i >= 0; i--)
                if (shops[i].x < player.x - 900) shops.splice(i, 1);

            // Score HUD (screen space)
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(10, 10, 180, 32);
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 18px "Comic Sans MS", cursive';
            ctx.textAlign = 'left';
            ctx.fillText(`🪙 ${score}  ⚔ ${equippedSword.name}`, 20, 31);

            drawShopUI(ctx);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
