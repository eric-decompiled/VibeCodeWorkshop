<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Workshop Chat</title>
</head>
<body class="chat-layout">
  <header>
    <h1>Workshop Chat</h1>
    <div class="me">you are <b id="me">…</b></div>
  </header>
  <div id="feed"></div>
  <div id="status-bar">connecting…</div>
  <form id="composer" class="composer">
    <input id="text" type="text" maxlength="500" autocomplete="off" placeholder="say something…" required />
    <button class="send" type="submit">send</button>
  </form>
  <script type="module" src="/src/chat.ts"></script>
</body>
</html>
